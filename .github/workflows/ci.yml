name: CI

on:
  push:
    branches: [main, master, 'upgrade/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: grogreen_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run production

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare writable directories
        run: chmod -R 775 storage bootstrap/cache

      - name: Check dependency security
        run: composer audit

      - name: Check PHP style
        run: vendor/bin/pint --test

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: grogreen_test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan route:cache
          php artisan view:cache
          php artisan test --no-coverage
